name: Build MCDR Plugin

run-name: Build AutoSaveRestart from ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package .mcdr
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read plugin metadata
        id: meta
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata_path = Path("mcdreforged.plugin.json")

          with metadata_path.open("r", encoding="utf-8") as file:
              metadata = json.load(file)

          name = metadata.get("name") or metadata["id"]
          version = metadata["version"]

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(f"name={name}\n")
              output.write(f"version={version}\n")

          print(f"Plugin: {name}")
          print(f"Version: {version}")
          PY

      - name: Build MCDR package
        shell: bash
        env:
          PLUGIN_NAME: ${{ steps.meta.outputs.name }}
          PLUGIN_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          metadata_path = Path("mcdreforged.plugin.json")
          package_dir = Path("autosave")
          dist_dir = Path("dist")

          if not metadata_path.is_file():
              raise SystemExit(
                  "mcdreforged.plugin.json not found"
              )

          if not package_dir.is_dir():
              raise SystemExit(
                  "autosave directory not found"
              )

          name = os.environ["PLUGIN_NAME"]
          version = os.environ["PLUGIN_VERSION"]

          dist_dir.mkdir(exist_ok=True)

          output_path = (
              dist_dir / f"{name}-v{version}.mcdr"
          )

          with zipfile.ZipFile(
              output_path,
              mode="w",
              compression=zipfile.ZIP_DEFLATED,
          ) as archive:
              archive.write(
                  metadata_path,
                  arcname="mcdreforged.plugin.json",
              )

              for path in sorted(
                  package_dir.rglob("*")
              ):
                  if not path.is_file():
                      continue

                  if "__pycache__" in path.parts:
                      continue

                  if path.suffix == ".pyc":
                      continue

                  archive.write(
                      path,
                      arcname=path.as_posix(),
                  )

          with zipfile.ZipFile(
              output_path,
              "r",
          ) as archive:
              names = set(archive.namelist())

              if "mcdreforged.plugin.json" not in names:
                  raise SystemExit(
                      "Invalid package: metadata missing"
                  )

              if not any(
                  name.startswith("autosave/")
                  for name in names
              ):
                  raise SystemExit(
                      "Invalid package: autosave missing"
                  )

          print(f"Built: {output_path}")
          print(
              f"Size: "
              f"{output_path.stat().st_size} bytes"
          )
          PY

      - name: Upload MCDR package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}-v${{ steps.meta.outputs.version }}
          path: dist/*.mcdr
          if-no-files-found: error
          compression-level: 0

      - name: Write build summary
        shell: bash
        run: |
          {
            echo "## MCDR package built successfully"
            echo ""
            echo "- Plugin: \`${{ steps.meta.outputs.name }}\`"
            echo "- Version: \`${{ steps.meta.outputs.version }}\`"
            echo "- File: \`${{ steps.meta.outputs.name }}-v${{ steps.meta.outputs.version }}.mcdr\`"
            echo ""
            echo "Download it from the Artifacts section."
          } >> "$GITHUB_STEP_SUMMARY"